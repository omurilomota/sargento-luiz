# CI — os portões de cada push.
#
# O projeto tem cinco testes-portão (anti-IA, semDesenho, semProcedural,
# semAssetQuebrado, semOrfao) dentro da suíte vitest, mais o type check e o
# build. Este workflow roda os três camadas a cada push/PR em develop e
# main — o mesmo gate local (`npx tsc --noEmit && npm test && npm run build`)
# que toda entrega da árvore já cumpre.
#
# As PROVAS DE NAVEGADOR (Playwright + Chrome headless) ficam fora do CI:
# são pesadas, precisam de Chrome e servem para validação de tela com o PNG
# aberto (regra 16) — rodam localmente via `npm run visual`/provas pontuais.
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Testes (suíte inteira, inclui os 5 portões anti-IA)
        run: npm test

      - name: Build de produção
        run: npm run build
