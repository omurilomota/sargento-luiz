<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bubble Shooter</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #111; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
    canvas { display: block; cursor: crosshair; }

    /* Top HUD - Stats */
    #hud-top {
      position: fixed; top: 0; left: 0; right: 0;
      height: 32px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 12px;
      pointer-events: none;
      z-index: 100;
    }

    .hud-top-left, .hud-top-right {
      display: flex; align-items: center; gap: 12px;
    }

    .hud-top-center {
      display: flex; align-items: center; gap: 16px;
    }

    /* Health Bar */
    .health-bar-container {
      display: flex; align-items: center; gap: 6px;
    }

    .health-bar {
      width: 90px; height: 5px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 2px;
      overflow: hidden;
    }

    .health-bar-fill {
      height: 100%;
      background: #7a9a6a;
      border-radius: 2px;
      transition: width 0.2s ease;
    }

    .health-text {
      font-family: monospace;
      font-size: 10px;
      color: #666;
      min-width: 28px;
    }

    .stat {
      font-family: monospace;
      font-size: 11px;
      color: #666;
    }

    .stat-coins { color: #a08050; }
    .stat-wave { color: #608090; }
    .stat-enemies { color: #b07050; }

    /* Bottom HUD - Weapon */
    #hud-bottom {
      position: fixed; bottom: 0; left: 0; right: 0;
      height: 28px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 12px;
      pointer-events: none;
      z-index: 100;
      background: rgba(0, 0, 0, 0.4);
    }

    .weapon {
      font-family: monospace;
      font-size: 10px;
      color: #555;
      padding: 2px 5px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 2px;
    }

    #combo {
      opacity: 0;
      transition: opacity 0.2s ease;
      font-family: monospace;
      font-size: 11px;
      color: #a08050;
      font-weight: bold;
    }

    #combo.active { opacity: 1; }

    #score-display {
      font-family: monospace;
      font-size: 12px;
      font-weight: bold;
      color: #a08050;
    }
  </style>
</head>
<body>
  <!-- Top HUD -->
  <div id="hud-top">
    <div class="hud-top-left">
      <div class="health-bar-container">
        <div class="health-bar">
          <div class="health-bar-fill" id="health-bar" style="width: 100%"></div>
        </div>
        <span class="health-text" id="health-text">100</span>
      </div>
    </div>

    <div class="hud-top-center">
      <span id="score-display"><span id="score">0</span></span>
      <span class="stat">
        <span class="stat-wave" id="phase">Floresta</span>
        <span style="color: #333;"> · </span>
        <span class="stat-wave" id="wave">1</span>
      </span>
      <span id="combo">x<span id="combo-text">2</span></span>
    </div>

    <div class="hud-top-right">
      <span class="stat stat-coins">$<span id="coins">0</span></span>
      <span class="stat stat-enemies">!<span id="enemies">0</span></span>
    </div>
  </div>

  <!-- Bottom HUD -->
  <div id="hud-bottom">
    <span class="weapon" id="weapon">Pistola</span>
    <span class="stat" style="color: #444;">WASD Mover · Mouse Mirar · Click Atirar</span>
  </div>

  <!-- Hidden inputs for game logic -->
  <input type="hidden" id="health" value="100">

  <canvas id="game"></canvas>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
