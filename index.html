<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bubble Shooter</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a1a; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
    canvas { display: block; cursor: crosshair; }
    #ui {
      position: absolute; top: 15px; left: 15px; color: #eee;
      font-family: monospace; font-size: 16px; pointer-events: none;
      background: rgba(0,0,0,0.6); padding: 12px 16px; border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    #ui div { margin-bottom: 4px; }
    #ui .health { color: #2ecc71; }
    #ui .score { color: #f1c40f; }
    #ui .wave { color: #3498db; }
    #ui .enemies { color: #e74c3c; }
    #ui .coins { color: #f1c40f; }
    #ui .phase { color: #9b59b6; }
  </style>
</head>
<body>
  <div id="ui">
    <div class="phase">Fase: <span id="phase">1</span></div>
    <div class="health">Vida: <span id="health">100</span></div>
    <div class="score">Pontos: <span id="score">0</span></div>
    <div class="coins">Moedas: <span id="coins">0</span></div>
    <div class="wave">Onda: <span id="wave">1</span></div>
    <div class="enemies">Inimigos: <span id="enemies">0</span></div>
  </div>
  <canvas id="game"></canvas>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
