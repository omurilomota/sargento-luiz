<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bubble Shooter</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #111; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
    canvas { display: block; cursor: crosshair; }

    /* Minimalist HUD - Bottom bar */
    #hud {
      position: fixed; bottom: 0; left: 0; right: 0;
      height: 40px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px;
      pointer-events: none;
      z-index: 100;
      background: rgba(0, 0, 0, 0.6);
    }

    .hud-left, .hud-right {
      display: flex; align-items: center; gap: 14px;
    }

    .hud-center {
      display: flex; align-items: center; gap: 16px;
    }

    /* Health Bar */
    .health-bar-container {
      display: flex; align-items: center; gap: 6px;
    }

    .health-bar {
      width: 100px; height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 3px;
      overflow: hidden;
    }

    .health-bar-fill {
      height: 100%;
      background: #7a9a6a;
      border-radius: 3px;
      transition: width 0.3s ease;
    }

    .health-text {
      font-family: monospace;
      font-size: 11px;
      color: #666;
      min-width: 32px;
    }

    /* Simple stat display */
    .stat {
      font-family: monospace;
      font-size: 12px;
      color: #777;
    }

    .stat-value {
      color: #ccc;
      font-weight: bold;
    }

    .stat-coins { color: #a08050; }
    .stat-wave { color: #608090; }
    .stat-enemies { color: #b07050; }

    /* Weapon */
    .weapon {
      font-family: monospace;
      font-size: 11px;
      color: #555;
      padding: 3px 6px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 3px;
    }

    /* Combo */
    #combo {
      opacity: 0;
      transition: opacity 0.2s ease;
      font-family: monospace;
      font-size: 12px;
      color: #a08050;
      font-weight: bold;
    }

    #combo.active { opacity: 1; }

    /* Score - top center */
    #score-display {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      font-family: monospace;
      font-size: 14px;
      font-weight: bold;
      color: #a08050;
      pointer-events: none;
      z-index: 100;
    }
  </style>
</head>
<body>
  <!-- Score Display - Top Center -->
  <div id="score-display">
    <span id="score">0</span>
  </div>

  <!-- HUD Bar - Bottom -->
  <div id="hud">
    <div class="hud-left">
      <!-- Health Bar -->
      <div class="health-bar-container">
        <div class="health-bar">
          <div class="health-bar-fill" id="health-bar" style="width: 100%"></div>
        </div>
        <span class="health-text" id="health-text">100</span>
      </div>
    </div>

    <div class="hud-center">
      <!-- Phase + Wave -->
      <span class="stat">
        <span class="stat-wave" id="phase">Floresta</span>
        <span style="color: #444;"> · </span>
        <span style="color: #666;">Onda</span>
        <span class="stat-wave" id="wave">1</span>
      </span>

      <!-- Combo -->
      <span id="combo">x<span id="combo-text">2</span></span>
    </div>

    <div class="hud-right">
      <!-- Weapon -->
      <span class="weapon" id="weapon">Pistola</span>

      <!-- Coins -->
      <span class="stat stat-coins">
        <span id="coins">0</span>
      </span>

      <!-- Enemies -->
      <span class="stat stat-enemies">
        <span id="enemies">0</span>
      </span>
    </div>
  </div>

  <!-- Hidden inputs for game logic -->
  <input type="hidden" id="health" value="100">

  <canvas id="game"></canvas>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
